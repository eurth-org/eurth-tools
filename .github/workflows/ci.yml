name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No npm cache: nothing is stored on GitHub beyond the code.
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
